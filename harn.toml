[package]
name = "harn-gitea-connector"
version = "0.1.0"
description = "Pure-Harn Gitea connector: signed webhooks, self-hosted REST dispatch, and raw API helpers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-gitea-connector"
connector_contract = "v1"

[exports]
default = "src/lib.harn"

[[providers]]
id = "gitea"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "rate_limit", "pagination"]

[providers.setup]
auth_type = "api-key"
flow = "api-key"
required_secrets = ["gitea/api-token", "gitea/webhook-secret"]
setup_command = ["harn", "connect", "gitea"]
validation_command = ["harn", "connect", "status", "--connector", "gitea", "--json"]

[[providers.setup.health_checks]]
id = "api-token"
kind = "secret"
secret = "gitea/api-token"

[[providers.setup.health_checks]]
id = "webhook-secret"
kind = "secret"
secret = "gitea/webhook-secret"

[providers.setup.recovery]
missing_auth = "Store gitea/api-token and gitea/webhook-secret before enabling Gitea bindings."
expired_credentials = "Rotate gitea/api-token, then rerun the Gitea connection validation."
revoked_credentials = "Replace gitea/api-token with an active Gitea personal access token."
missing_scopes = "Grant repository and pull request scopes required by the configured Gitea workflows."
inaccessible_resource = "Confirm the token can access the target Gitea host, owner, and repository."
transient_provider_outage = "Retry after the Gitea host API and webhook endpoints are healthy."

[dependencies]

[connector_contract]
version = 1

# Security sweep 2026-05-23 (F3): with no signing secret configured for this binding the
# connector now fail-closes with 401 missing_signature instead of accepting an unsigned
# delivery. The contract harness does not seed per-binding secrets, so the unsigned-happy-path
# fixture inverts to assert the rejection envelope. A future fixture-seeding contract bump
# can restore an "event" happy-path that exercises full verification end-to-end.
[[connector_contract.fixtures]]
provider = "gitea"
name = "happy path (fail-closed when no secret)"
kind = "webhook"
headers = { "x-gitea-event" = "pull_request", "x-gitea-delivery" = "delivery-1" }
body_json = { action = "opened", repository = { full_name = "acme/widgets" }, sender = { login = "ada" }, pull_request = { number = 42, title = "Improve widgets" } }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0

# Malformed JSON still rejects with 400, but now the rejection happens *after* signature
# verification (F14: verify before parse). Without a configured secret this fixture also hits
# the F3 fail-closed path and returns 401, not 400. We update the assertion accordingly.
[[connector_contract.fixtures]]
provider = "gitea"
name = "malformed payload"
kind = "webhook"
headers = { "x-gitea-event" = "pull_request" }
body = "{not json"
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0
